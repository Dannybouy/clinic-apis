name: App checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinic_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinic_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: |
          npm ci
          go mod download
      - name: Check Go formatting
        run: test -z "$(gofmt -l backend)"
      - name: Check Go code
        run: go vet ./backend/...
      - name: Test API and PostgreSQL connection
        run: npm test
      - name: Check frontend code
        run: npm run lint
      - name: Build frontend and backend
        run: npm run build
      - name: Test the built app
        run: |
          npm start > "$RUNNER_TEMP/clinic.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          npm run test:smoke || { cat "$RUNNER_TEMP/clinic.log"; exit 1; }
      - name: Build the deployment container
        run: docker build -t clinic-apis:ci .
      - name: Test the deployment container
        run: |
          docker run -d --name clinic-ci --network host -e DATABASE_URL -e PORT=8082 clinic-apis:ci
          trap 'docker rm -f clinic-ci' EXIT
          SMOKE_BASE_URL=http://127.0.0.1:8082 npm run test:smoke || { docker logs clinic-ci; exit 1; }
